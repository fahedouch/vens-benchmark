schema_version: 2
project:
  name: internal-batch-tool
  description: Internal-only batch report generator (Java)
context:
  exposure: internal
  data_sensitivity: low
  business_criticality: low
  listener: absent
  data_subjects: millions
  detection:
    network: not_logged
    host: not_logged
    application: not_logged
  traceability: none
  controls:
    segmentation: true
    ids: true
  notes: Log4j is present but message-lookup substitution is disabled (log4j2.formatMsgNoLookups=true)
    and no untrusted/user-controlled input is ever passed to the logger. Internal-only
    tool with no outbound network to reach an attacker LDAP server; the RCE path is
    not reachable.
reachability:
- component: org.apache.logging.log4j:log4j-core
  reachable: false
  provenance: Log4j is present but message-lookup substitution is disabled (log4j2.formatMsgNoLookups=true)
    and no untrusted/user-controlled input is ever passed to the logger. Internal-only
    tool with no outbound network to reach an attacker LDAP server; the RCE path is
    not reachable.
